r/identified ATS or auth provider before following its verify-email action. Confirm activation, return to the same application and continue. Record only secret-free account routing and activation outcome. This is authentication, not Gmail status sync. Reset/recovery/security-change links, unrelated services, unverified destinations, CAPTCHA, non-email MFA and mandatory tool confirmations still require checkpoint/handoff under active tool rules; continue other jobs."
